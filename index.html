<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DGame — Babylon.js port</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #renderCanvas { width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%,-50%); }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.85); }
    #crosshair::before { left: 11px; top: 2px; width: 2px; height: 20px; }
    #crosshair::after { left: 2px; top: 11px; width: 20px; height: 2px; }
    .panel { position: absolute; color: #fff; text-shadow: 0 0 6px #000, 0 0 2px #000; }
    #stats { left: 20px; top: 20px; font-size: 24px; }
    #camCount { left: 20px; top: 90px; font-size: 20px; }
    #hint { left: 50%; bottom: 90px; transform: translateX(-50%); font-size: 20px; text-align: center; }
    #camLabel { left: 50%; top: 20px; transform: translateX(-50%); font-size: 20px; display: none; }
    #toast { left: 50%; top: 60px; transform: translateX(-50%); font-size: 20px; display: none; }
    #navArrow { left: 50%; top: 50%; font-size: 48px; display: none; color: #ffd54a; }
    #lockHint { left: 50%; top: 58%; transform: translateX(-50%); font-size: 20px; display: none; background: rgba(0,0,0,.55); padding: 8px 18px; border-radius: 8px; pointer-events: auto; cursor: pointer; }
    #errbox { position: fixed; left: 8px; bottom: 8px; z-index: 99; display: none; color: #ff8080; background: rgba(0,0,0,.75); font-size: 13px; max-width: 60%; white-space: pre-wrap; padding: 6px 10px; border-radius: 6px; }
    #debug { position: fixed; right: 8px; top: 8px; z-index: 99; display: none; color: #8fff8f; background: rgba(0,0,0,.6); font-size: 13px; padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; }
    #monitorHelp { left: 50%; bottom: 130px; transform: translateX(-50%); font-size: 16px; display: none; text-align: center; }
    #fade { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .1s linear; }
    #dmgFlash { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(190,0,0,.18) 0%, rgba(200,0,0,.55) 62%, rgba(150,0,0,.92) 100%); }
    #pause { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); display: none; z-index: 30; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    #pause button { pointer-events: auto; font-size: 20px; padding: 10px 28px; cursor: pointer; }
    #start { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.75); z-index: 40; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; }
    #start button { font-size: 22px; padding: 12px 34px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="stats" class="panel">Здоровье: 100<br>Мясо: 0</div>
    <div id="camCount" class="panel">Камеры: 0 / 5</div>
    <div id="hint" class="panel"></div>
    <div id="camLabel" class="panel"></div>
    <div id="toast" class="panel"></div>
    <div id="navArrow" class="panel">▲</div>
    <div id="lockHint" class="panel">Кликни, чтобы захватить мышь</div>
    <div id="monitorHelp" class="panel">Стрелки / WASD — вращение камеры<br>C — следующая | X — предыдущая | M — метка<br>Esc — выйти</div>
  </div>
  <div id="fade"></div>
  <div id="dmgFlash"></div>
  <div id="errbox"></div>
  <div id="debug"></div>
  <div id="pause">
    <div style="color:#fff;font-size:34px">ПАУЗА</div>
    <button id="btnContinue">Продолжить</button>
    <button id="btnRestart">Заново (дом)</button>
  </div>
  <div id="start">
    <div style="font-size:28px">3DGame — Babylon.js порт</div>
    <div>WASD — движение, Space — прыжок, ЛКМ (удерживать) — натянуть лук, E — дверь / камеры / монитор</div>
    <button id="btnStart">Играть</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
